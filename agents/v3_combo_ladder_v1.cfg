    "STRAWBERRY":  {"base": 120, "T": 100,  "below_func": "sqrt",   "below_target": 0.70, "above_func": "linear", "above_target": 1.60},
    "MELON":       {"base": 250, "T": 300,  "below_func": "log",    "below_target": 0.20, "above_func": "sq",     "above_target": 3.60},
